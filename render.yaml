# Blueprint do Render. Com este arquivo no repositório, o Render monta o
# serviço sozinho — não é preciso preencher build/start command na mão.
#
# Usa o runtime Node, e não o Dockerfile que existe na raiz: o build fica
# mais rápido e o Dockerfile continua ali só para portabilidade (Fly,
# Railway) caso o Render deixe de servir.
services:
  - type: web
    name: downpipe
    runtime: node
    plan: free
    # Sem região na América do Sul; Virginia é a de menor latência pro Brasil.
    region: virginia

    # --include=dev é obrigatório, e não redundante: o NODE_ENV=production
    # declarado abaixo vale também durante o build, e faz o npm pular todas
    # as devDependencies — entre elas o typescript e o tsc-alias, que são
    # justamente o que compila. Sem a flag, o tsc do projeto não é instalado
    # e o build cai num TypeScript qualquer de fora, com outra versão.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # sync: false = o Render NÃO lê o valor daqui; você preenche no painel.
      # É o que mantém as chaves fora do repositório.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STATUS_SECRET
        sync: false

      # Pasta do PWA dentro deste repositório. É o que faz o mesmo serviço
      # entregar a landing, o app e a API na mesma origem — sem CORS e sem
      # um segundo serviço pra manter. O conteúdo vem do "npm run build:web"
      # do projeto do app.
      - key: WEB_DIST_PATH
        value: ./web

      # Endereço público, usado no link do e-mail de recuperação de senha.
      # Sem ele o Supabase manda pro Site URL do painel dele, que pode não
      # ser o nosso — e o link do e-mail leva a pessoa pra lugar nenhum.
      - key: APP_URL
        value: https://downpipe.onrender.com

    # PORT não entra aqui: o Render injeta a porta e o env.ts já a lê.
    # DATABASE_URL também não: só o runner de migrations usa, e migrations
    # continuam rodando da sua máquina, não do servidor.
