<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Downpipe</title>
<meta name="description" content="O endereço não existe ou saiu do ar.">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="theme-color" content="#0E0E0E">
<meta name="robots" content="noindex">
<style>
  /* A mesma Inter do app (public/fonts). */
  @font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(/fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(/fonts/inter-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0E0E0E}
  body{
    color:#fff;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px}
  img{width:min(240px,68vw);height:auto;margin:0 auto 34px;display:block;opacity:.9}
  .cod{font-size:12px;letter-spacing:3px;color:#E53935;font-weight:700;margin:0 0 10px}
  h1{font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
  p{color:#A8A8A8;font-size:15px;line-height:1.6;margin:0 0 28px}
  .acoes{display:flex;flex-direction:column;gap:10px}
  a{
    display:block;text-decoration:none;padding:14px 20px;
    font-size:13px;font-weight:700;letter-spacing:1.4px;
    border:1px solid transparent;
  }
  .primario{background:#E53935;color:#fff}
  .secundario{background:transparent;color:#fff;border-color:#2A2A2A}
  a:focus-visible{outline:2px solid #E53935;outline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/logo-lp.png" alt="Downpipe">
    <p class="cod">ERRO 404</p>
    <h1>Esse endereço não existe</h1>
    <p>
      Ou o link veio quebrado, ou a página saiu do ar. Acontece.
    </p>
    <div class="acoes">
      <a class="primario" href="/app/">ABRIR O DOWNPIPE</a>
      <a class="secundario" href="/">VOLTAR PRO INÍCIO</a>
    </div>
  </div>
</body>
</html>
